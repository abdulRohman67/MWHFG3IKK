<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
    }
    .login-box {
      width: 300px;
      margin: 120px auto;
      background: white;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
    }
    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    #loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      color: blue;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h3>Login</h3>
  <input type="text" id="sap" placeholder="No SAP">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <div id="loading">Loading...</div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
