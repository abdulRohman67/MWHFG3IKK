<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MWH-FGIKK-PM3</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="side-navbar active-nav d-flex flex-column" id="sidebar">
  <ul class="nav flex-column text-white w-100">
    <a class="nav-link h6 text-white">PT INDAH KIAT KARAWANG</a>
    <li class="nav-item">
      <a href="index.html" class="nav-link text-white">Input Data</a>
    </li>
    <li class="nav-item">
      <a href="delivery.html" class="nav-link text-white">Data Delivery</a>
    </li>
    <li class="nav-item">
      <a href="logout.html" class="nav-link text-white">Logout</a>
    </li>
  </ul>
</div>

<!-- MAIN -->
<div class="my-container active-cont p-3">

<nav class="navbar bg-light px-3">
  <button class="btn" id="menu-btn"><i class="bx bx-menu"></i></button>
  <b>Aplikasi MWH</b>
</nav>

<h4 class="mt-3">FORM INPUT DATA MWH PM 3</h4>

<!-- FORM -->
<div class="row g-2 mb-3">
  <div class="col"><input id="mid" class="form-control" placeholder="ID"></div>
  <div class="col"><input type="number" id="material" class="form-control" placeholder="Material"></div>
  <div class="col">
    <select id="bin" class="form-select">
      <option value="">BIN</option>
      <option>A</option>
      <option>B</option>
      <option>C</option>
    </select>
  </div>
  <div class="col"><input id="defect" class="form-control" placeholder="Defect"></div>
  <div class="col"><input id="net" class="form-control" placeholder="Net"></div>
  <div class="col"><button id="simpan" class="btn btn-primary w-100">Simpan</button></div>
</div>

<hr>

<!-- SEARCH -->
<h6>Search Data</h6>
<div class="row g-2 mb-2">
  <div class="col"><input id="searchId" class="form-control" placeholder="Cari ID"></div>
  <div class="col-3"><input type="date" id="searchDate" class="form-control"></div>
</div>

<!-- DELIVERY -->
<div class="row g-2 mb-3">
  <div class="col-3"><input type="date" id="tglDelivery" class="form-control"></div>
  <div class="col">
    <button class="btn btn-warning" onclick="kirimDelivery()">Delivery</button>
    <button class="btn btn-success" onclick="downloadExcel()">Download Excel</button>
  </div>
</div>

<!-- LOADING -->
<div id="loading" class="text-center my-4" style="display:none;">
  <div class="spinner-border text-primary"></div>
  <p class="mt-2">Memuat data...</p>
</div>

<!-- TABLE -->
<table class="table table-bordered table-striped">
  <thead class="table-dark">
    <tr>
      <th><input type="checkbox" id="checkAll"></th>
      <th>ID</th>
      <th>Material</th>
      <th>BIN</th>
      <th>Defect</th>
      <th>Net</th>
      <th>Tgl Input</th>
      <th>Tgl Delivery</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody id="listData"></tbody>
</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="index.js"></script>

<script>
document.getElementById("menu-btn").onclick = () => {
  document.getElementById("sidebar").classList.toggle("active-nav");
  document.querySelector(".my-container").classList.toggle("active-cont");
};
</script>

</body>
</html>
